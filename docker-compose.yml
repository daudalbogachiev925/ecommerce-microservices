services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrator:
    build:
      context: .
      dockerfile: scripts/migrator.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable
    restart: "no"

  users:
    build:
      context: .
      dockerfile: services/users/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/users?sslmode=disable
      NATS_URL: nats://nats:4222
      JWT_SECRET: dev-secret-change-me
      HTTP_ADDR: ":8081"
    ports: ["8081:8081"]

  catalog:
    build:
      context: .
      dockerfile: services/catalog/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/catalog?sslmode=disable
      HTTP_ADDR: ":8082"
    ports: ["8082:8082"]

  cart:
    build:
      context: .
      dockerfile: services/cart/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/cart?sslmode=disable
      HTTP_ADDR: ":8083"
    ports: ["8083:8083"]

  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/orders?sslmode=disable
      NATS_URL: nats://nats:4222
      CATALOG_URL: http://catalog:8082
      CART_URL: http://cart:8083
      HTTP_ADDR: ":8084"
    ports: ["8084:8084"]

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/payments?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: ":8085"
    ports: ["8085:8085"]

  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      nats: { condition: service_healthy }
      migrator: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/notifications?sslmode=disable
      NATS_URL: nats://nats:4222
      HTTP_ADDR: ":8086"
    ports: ["8086:8086"]

  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    depends_on:
      users: { condition: service_started }
      catalog: { condition: service_started }
      cart: { condition: service_started }
      orders: { condition: service_started }
    environment:
      USERS_URL: http://users:8081
      CATALOG_URL: http://catalog:8082
      CART_URL: http://cart:8083
      ORDERS_URL: http://orders:8084
      PAYMENTS_URL: http://payments:8085
      JWT_SECRET: dev-secret-change-me
      HTTP_ADDR: ":8080"
    ports: ["8080:8080"]

volumes:
  pgdata:
  natsdata:
